<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Solstice Cipher cover</title>
  <desc id="desc">Cover art for Solstice Cipher, a June Solstice Game Jam browser puzzle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.52" stop-color="#123344"/>
      <stop offset="1" stop-color="#1f4b35"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="1" stop-color="#ffcf5a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1600" height="1600" fill="url(#sky)"/>
  <circle cx="290" cy="310" r="170" fill="url(#sun)" opacity="0.95"/>
  <circle cx="1280" cy="1180" r="230" fill="#5ea2ff" opacity="0.28"/>
  <path d="M-150 1320 C230 980 450 1390 790 1080 C1080 780 1240 1040 1720 730" fill="none" stroke="#8ef6d5" stroke-width="190" opacity="0.19"/>
  <g opacity="0.24">
    <path d="M100 170 H1500 M100 350 H1500 M100 530 H1500 M100 710 H1500 M100 890 H1500 M100 1070 H1500 M100 1250 H1500 M100 1430 H1500" stroke="#d6eee8" stroke-width="2"/>
    <path d="M180 80 V1520 M380 80 V1520 M580 80 V1520 M780 80 V1520 M980 80 V1520 M1180 80 V1520 M1380 80 V1520" stroke="#d6eee8" stroke-width="2"/>
  </g>
  <rect x="140" y="250" width="1320" height="1080" rx="60" fill="#071522" stroke="#8ef6d5" stroke-opacity="0.32" stroke-width="3" filter="url(#shadow)"/>
  <text x="220" y="390" fill="#8ef6d5" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="8">JUNE SOLSTICE GAME JAM</text>
  <text x="220" y="570" fill="#f8fbf4" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-7">Solstice</text>
  <text x="220" y="700" fill="#f8fbf4" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="-7">Cipher</text>
  <text x="225" y="805" fill="#d6eee8" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="38">Balance light and shadow.</text>
  <text x="225" y="860" fill="#d6eee8" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="38">Decode the Turing gate.</text>
  <g transform="translate(230 980)">
    <rect width="350" height="108" rx="28" fill="#14243a" stroke="#ffcf5a" stroke-width="4"/>
    <circle cx="48" cy="48" r="18" fill="#ffcf5a"/>
    <text x="88" y="59" fill="#fff4b8" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="900">light spark</text>
  </g>
  <g transform="translate(650 980)">
    <rect width="390" height="108" rx="28" fill="#14243a" stroke="#5ea2ff" stroke-width="4"/>
    <circle cx="48" cy="48" r="18" fill="#5ea2ff"/>
    <text x="88" y="59" fill="#d8e8ff" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="900">shadow spark</text>
  </g>
  <g transform="translate(230 1160)">
    <rect width="1040" height="108" rx="28" fill="#8ef6d5"/>
    <text x="44" y="59" fill="#071522" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="900">Turing gate</text>
    <text x="260" y="59" fill="#071522" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28">opens only when the cipher and balance align</text>
  </g>
</svg>
